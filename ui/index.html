<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PathSnap evaluator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
body{font:16px system-ui;margin:0;background:#f4f7fb;color:#132238}header{padding:18px 24px;background:#12304a;color:white}main{padding:20px;max-width:1100px;margin:auto}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select,button{padding:10px;border:1px solid #ccd5df;border-radius:8px}button{background:#167d9a;color:white;border:0;cursor:pointer}#map{height:68vh;border-radius:12px;background:white}.note{color:#506174;font-size:14px}</style></head>
<body><header><strong>PathSnap</strong> · Route reconstruction demo</header><main><div class="controls"><input id="api" value="http://localhost:8000" aria-label="API address"><button id="load">Load trips</button><select id="trip" aria-label="Trip"></select><button id="run">Predict route</button></div><p class="note" id="status">Connect to the model laptop API.</p><div id="map"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([0,0],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let layers=[];const status=document.querySelector('#status'),api=()=>document.querySelector('#api').value.replace(/\/$/,'');
document.querySelector('#load').onclick=async()=>{try{const r=await fetch(api()+'/trips');if(!r.ok)throw Error(await r.text());const d=await r.json(),s=document.querySelector('#trip');s.innerHTML='';d.trips.forEach(x=>s.add(new Option(x,x)));status.textContent=`Loaded ${d.trips.length} enabled trips.`}catch(e){status.textContent='Could not load trips: '+e.message}};
document.querySelector('#run').onclick=async()=>{try{const id=document.querySelector('#trip').value;if(!id)throw Error('Load and select a trip first.');const r=await fetch(api()+'/predict/'+encodeURIComponent(id));if(!r.ok)throw Error(await r.text());const d=await r.json();layers.forEach(x=>map.removeLayer(x));layers=[];const gps=d.observations.map(p=>[p[1],p[0]]);layers.push(L.polyline(gps,{color:'#2878b5',weight:3,dashArray:'5 5'}).addTo(map));const route=d.predicted_arc_ids.map(a=>{const e=d.arcs[a];const n=d.nodes[e[0]];return [n[1],n[0]]});if(route.length)layers.push(L.polyline(route,{color:'#e05252',weight:5}).addTo(map));map.fitBounds(L.latLngBounds(gps));status.textContent=`${id}: ${d.observations.length} GPS observations; route shown in red. ${d.mode.includes('baseline')?'Geometry baseline; trained model artifact pending.':''}`}catch(e){status.textContent='Prediction failed: '+e.message}};
</script></body></html>
